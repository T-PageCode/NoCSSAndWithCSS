<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>有CSS和无CSS的区别</title>
    <style>
        body{
            background: linear-gradient(90deg,rgb(199, 255, 243),rgb(78, 255, 217));
            -moz-user-select: none;
            -webkit-user-select: none;
            -o-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        #div_id1{
            position: fixed;
            top: 2.9%;
            left: 50%;
            transform: translate(-50%,-50%);
            background-color: rgb(0, 187, 156);
            width: 100%;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #div_id3{
            margin-top: 240px;
            margin-left: 480px;
        }
        #div_id2{
            margin-top: 240px;
            margin-left: 160px;
        }
        .div_class1{
            position: fixed;
            transform: translate(-50%,-50%);
            background-color: white;
            width: 300px;
            height: 300px;
            border: 4px solid transparent;
            border-radius: 10px;
            transition: border-color 0.3s ease;
        }
        .div_class1:hover{
            border-color: rgb(0, 255, 242)
        }
        #text1{
            color: white;
            font-weight: 200;
        }
        .text2{
            position: fixed;
            top: 5%;
            left: 50%;
            transform: translate(-50%,-50%);
            white-space: nowrap;
            font-weight: 200;
        }
        .text3{
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translate(-50%,-50%);
            white-space: nowrap;
            font-size: 15px;
            color: rgb(0,0,0,0.7);
            font-weight: 200;
        }
        #btn1{
            left: 25%;
        }
        #btn2{
            left: 75%;
        }
        .btnClass1{
            position: fixed;
            top: 80%;
            transform: translate(-50%,-50%);
            width: 40%;
            height: 15%;
            background-color: rgb(0, 255, 213);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            font-weight: 200;
            transition: background-color 0.5s ease;
        }
        .btnClass1:hover{
            background-color:rgb(0, 194, 162);
        }
    </style>
</head>
<body>
    <div id="div_id1">
        <h1 id="text1">有CSS和无CSS的区别</h1>
    </div>
    <div class="div_class1" id="div_id2">
        <h1 class="text2">登录页对比</h1>
        <p class="text3">对比有CSS和无CSS的登录页</p>
        <button class="btnClass1" id="btn1" onclick="window.location.href='./NoAndWith-HTML/Login/Login_NoCSS.html'">查看无CSS页面</button>
        <button class="btnClass1" id="btn2" onclick="window.location.href='./NoAndWith-HTML/Login/Login_WithCSS.html'">查看有CSS页面</button>
    </div>
    <div class="div_class1" id="div_id3">
        <h1 class="text2">Hello World对比</h1>
        <p class="text3">对比有CSS和无CSS的Hello World演示页</p>
        <button class="btnClass1" id="btn1" onclick="window.location.href='./NoAndWith-HTML/Hello-World/HelloWorld_NoCSS.html'">查看无CSS页面</button>
        <button class="btnClass1" id="btn2" onclick="window.location.href='./NoAndWith-HTML/Hello-World/HelloWorld_WithCSS.html'">查看有CSS页面</button>
    </div>
    <script>
        document.addEventListener("contextmenu",(NoCtm) => {
            NoCtm.preventDefault();
        })
    </script>
</body>
</html>
